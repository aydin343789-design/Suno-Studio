name: Build signed Suno Studio Android APK
# Release signing uses the persistent repository Actions secrets.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64" || { echo "Missing SIGNING_KEY_BASE64 repository secret"; exit 1; }
          mkdir -p android-native/signing
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > android-native/signing/sunostudio-release.jks
          test -s android-native/signing/sunostudio-release.jks
      - name: Build signed release APK
        working-directory: android-native
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suno-Studio-signed-release-apk
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
